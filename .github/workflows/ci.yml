name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      # Keep these five commands in sync with the `test` service in docker-compose.yml.
      - name: Get dependencies (locked)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --release

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: firebase/.nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      # firebase-tools 15 refuses to start the emulators on Java < 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install (locked)
        run: npm ci
      - name: Rules tests
        run: npm test
