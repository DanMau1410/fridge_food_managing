services:
  # Development: live Flutter web server with the source mounted.
  # Run: docker compose up dev  -> http://localhost:8080
  dev:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      # Container-only .dart_tool/build: keeps root-owned, container-path files off the host.
      - /app/.dart_tool
      - /app/build
    stdin_open: true
    tty: true

  # Production-like: release web build served by nginx.
  # Run: docker compose up --build web  -> http://localhost:8081
  web:
    build:
      context: .
      target: web
    ports:
      - "8081:80"

  # One-off checks, same as CI (.github/workflows/ci.yml): docker compose run --rm test
  test:
    build:
      context: .
      target: dev
    command: >-
      sh -c "flutter pub get --enforce-lockfile
      && dart format --output=none --set-exit-if-changed .
      && flutter analyze
      && flutter test
      && flutter build web --release"
    volumes:
      - .:/app
      - /app/.dart_tool
      - /app/build
